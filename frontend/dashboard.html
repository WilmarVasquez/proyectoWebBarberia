<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard - Barbería</title>
    <!-- Tailwind CSS (vía CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .bg-dark {
        background-color: #000000;
      }
      .text-orange {
        color: #cd7f09;
      }
    </style>
  </head>
  <body class="bg-dark text-orange font-sans min-h-screen">
    <!-- Header con botón 'Cerrar' -->
    <header class="flex justify-end items-center p-4 border-b border-[#cd7f09]">
      <button
        class="bg-[#cd7f09] text-black px-4 py-2 rounded font-semibold mr-4"
        onclick="cerrarDashboard()"
      >
        CERRAR
      </button>
    </header>

    <!-- Contenedor principal -->
    <main class="p-4 flex flex-col md:flex-row gap-8">
      <!-- Columna Izquierda: avatar, nombre, correo, teléfono -->
      <aside class="w-full md:w-1/3 flex flex-col items-center">
        <!-- Avatar y botón EDITAR -->
        <div class="flex items-center mb-4">
          <!-- Avatar (imagen de ejemplo) -->
          <img
            id="userAvatar"
            src="https://placehold.co/200x200?text=Avatar"
            alt="Foto Usuario"
            class="rounded-full w-48 h-48 object-cover border-4 border-[#cd7f09]"
          />
          <!-- Botón Editar -->
          <button
            id="btnEditUser"
            class="bg-gray-700 text-white p-2 rounded ml-4 hover:bg-gray-600 transition"
          >
            Editar
          </button>
        </div>

        <div class="text-center">
          <h2 id="userName" class="text-xl font-bold mb-1">Cargando...</h2>
          <p id="userEmail" class="text-sm mb-1">...</p>
          <p id="userPhone" class="text-sm mb-6">...</p>
        </div>

        <!-- Botones (Tomar turno, Pagar servicios, MIS CITAS) -->
        <div class="flex flex-col items-center gap-6">
          <button id="btnTomarTurno" class="flex flex-col items-center mt-4">
            <img
              src="https://placehold.co/80x80?text=Turno"
              alt="Tomar turno"
              class="mb-2"
            />
            <span class="font-semibold">TOMAR TURNO</span>
          </button>
          <button class="flex flex-col items-center">
            <img
              src="https://placehold.co/80x80?text=Pago"
              alt="Pagar servicios"
              class="mb-2"
            />
            <span class="font-semibold">PAGAR SERVICIOS</span>
          </button>
        </div>

        <button
          id="btnMisCitas"
          class="bg-gray-700 text-white p-2 rounded mt-4 hover:bg-gray-600 transition"
        >
          Mis Citas
        </button>
      </aside>

      <!-- Columna Derecha: información adicional (con el formulario de tomar turno) -->
      <section class="w-full md:w-2/3 bg-black p-4 rounded">
        <h3 class="text-lg font-bold mb-4">Agendar Cita</h3>
        <div class="bg-white text-black p-4 rounded">
          <!-- Formulario para agendar cita -->
          <form id="formTomarTurno">
            <!-- Calendario con selector de fecha -->
            <div class="mb-4">
              <label class="block mb-1 text-sm font-medium" for="calendar"
                >Fecha</label
              >
              <input
                type="date"
                id="calendar"
                class="w-full p-2 border border-[#cd7f09] rounded"
                required
              />
            </div>
            <div class="mb-4">
              <label class="block mb-1 text-sm font-medium" for="selectBarbero"
                >Barbero</label
              >
              <select
                id="selectBarbero"
                class="w-full border border-gray-300 rounded px-2 py-1 focus:outline-none"
                required
              >
                <option value="">Cargando barberos...</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="block mb-1 text-sm font-medium" for="selectHora"
                >Hora</label
              >
              <select
                id="selectHora"
                class="w-full border border-gray-300 rounded px-2 py-1 focus:outline-none"
                required
              >
                <option value="">Seleccionar hora</option>
                <!-- Opciones de horas se cargarán dinámicamente -->
              </select>
            </div>
            <div class="flex justify-end gap-2">
              <button
                type="submit"
                class="px-3 py-1 bg-[#cd7f09] text-black font-semibold rounded"
              >
                Agendar
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="text-center mt-8 border-t border-[#cd7f09] pt-4">
      <p>Calle 13 N° 13 - 13, Pereira</p>
      <p>3219882864</p>
      <p>@losvuitton</p>
    </footer>

    <!-- Modal para ver las citas -->
    <div
      id="modalMisCitas"
      class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center"
    >
      <div class="bg-white text-black rounded p-6 w-96">
        <h2 class="text-lg font-bold mb-4">Mis Citas Agendadas</h2>
        <table id="citasTable" class="w-full mb-4">
          <thead>
            <tr>
              <th class="text-left">Fecha</th>
              <th class="text-left">Hora</th>
              <th class="text-left">Barbero</th>
              <th class="text-left">Acciones</th>
            </tr>
          </thead>
          <tbody id="citasList"></tbody>
        </table>
        <button
          id="btnCerrarCitas"
          class="mt-4 w-full px-4 py-2 bg-gray-500 text-white rounded"
        >
          Cerrar
        </button>
      </div>
    </div>

    <!-- Script -->
    <script>
      // Función para volver a la página de inicio
      function cerrarDashboard() {
        localStorage.removeItem("userId");
        window.location.href = "./index.html";
      }

      // Referencias al DOM
      const userAvatar = document.getElementById("userAvatar");
      const userName = document.getElementById("userName");
      const userEmail = document.getElementById("userEmail");
      const userPhone = document.getElementById("userPhone");
      const btnEditUser = document.getElementById("btnEditUser");
      const formTomarTurno = document.getElementById("formTomarTurno");
      const selectBarbero = document.getElementById("selectBarbero");
      const selectHora = document.getElementById("selectHora");
      const calendarInput = document.getElementById("calendar");
      const btnMisCitas = document.getElementById("btnMisCitas");
      const modalMisCitas = document.getElementById("modalMisCitas");
      const citasList = document.getElementById("citasList");
      const btnCerrarCitas = document.getElementById("btnCerrarCitas");

      // Función para obtener el nombre del barbero por su ID
      async function obtenerNombreBarbero(barberoId) {
        try {
          const response = await fetch(
            `http://localhost:4000/api/barberos/${barberoId}`
          );
          if (!response.ok) {
            throw new Error("Error al obtener el nombre del barbero");
          }
          const barbero = await response.json();
          return barbero.nombre; // Retornar el nombre del barbero
        } catch (error) {
          console.error(error);
          return "Barbero desconocido"; // En caso de error, retornar un valor por defecto
        }
      }

      // Función para cargar los barberos disponibles
      async function cargarBarberos() {
        try {
          const response = await fetch("http://localhost:4000/api/barberos");
          if (!response.ok) {
            throw new Error("Error al cargar barberos");
          }
          const barberos = await response.json();
          selectBarbero.innerHTML =
            '<option value="">Seleccionar barbero</option>';
          barberos.forEach((barbero) => {
            selectBarbero.innerHTML += `<option value="${barbero._id}">${barbero.nombre}</option>`;
          });
        } catch (error) {
          console.error(error);
          alert("Error al cargar barberos");
        }
      }

      // Función para cargar las horas disponibles
      function cargarHoras() {
        selectHora.innerHTML = '<option value="">Seleccionar hora</option>';
        const horas = [];
        for (let hora = 8; hora <= 21; hora++) {
          horas.push(`${hora}:00`);
        }
        horas.forEach((hora) => {
          selectHora.innerHTML += `<option value="${hora}">${hora}</option>`;
        });
      }

      // Cargar barberos y horas al iniciar la página
      document.addEventListener("DOMContentLoaded", async () => {
        await cargarBarberos();
        cargarHoras();
      });

      // Guardar la cita con barbero y hora seleccionados
      formTomarTurno.addEventListener("submit", async (e) => {
        e.preventDefault();

        const selectedBarbero = selectBarbero.value;
        const selectedHora = selectHora.value;
        const selectedDate = calendarInput.value;

        if (!selectedBarbero || !selectedHora || !selectedDate) {
          alert("Por favor, selecciona una fecha, un barbero y una hora.");
          return;
        }

        const userId = localStorage.getItem("userId");

        if (!userId) {
          alert("No has iniciado sesión. Redirigiendo a inicio.");
          window.location.href = "./index.html";
          return;
        }

        try {
          // Obtener el nombre del barbero
          const nombreBarbero = await obtenerNombreBarbero(selectedBarbero);

          // Formatear la fecha y hora correctamente
          const fechaHora = `${selectedDate}T${selectedHora}:00.000Z`;

          // Verificar que la fecha sea válida
          if (isNaN(new Date(fechaHora).getTime())) {
            throw new Error("La fecha y hora seleccionadas no son válidas.");
          }

          // Agendar la cita
          const response = await fetch("http://localhost:4000/api/citas", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              userId,
              fecha: fechaHora, // Usar la fecha formateada
              barberoId: selectedBarbero,
            }),
          });

          if (!response.ok) {
            const errorData = await response.json();
            alert("Error al agendar la cita: " + errorData.message);
            return;
          }

          const data = await response.json();
          alert(
            `Cita agendada para el ${data.fecha.split("T")[0]} a las ${
              data.fecha.split("T")[1].split(":")[0]
            }:00 con ${nombreBarbero}`
          );
        } catch (error) {
          console.error(error);
          alert("Error al agendar la cita: " + error.message);
        }
      });

      // Función para cargar las citas del usuario
      async function cargarCitas() {
        const userId = localStorage.getItem("userId");
        if (!userId) {
          alert("No has iniciado sesión. Redirigiendo a inicio.");
          window.location.href = "./index.html";
          return;
        }

        try {
          const response = await fetch(
            `http://localhost:4000/api/citas/${userId}`
          );
          if (!response.ok) {
            throw new Error("Error al cargar las citas");
          }
          const citas = await response.json();

          // Limpiar la lista de citas
          citasList.innerHTML = "";

          // Mostrar las citas en la tabla
          citas.forEach((cita) => {
            const fecha = new Date(cita.fecha).toLocaleDateString();
            const hora = new Date(cita.fecha).toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit",
            });

            citasList.innerHTML += `
              <tr>
                <td>${fecha}</td>
                <td>${hora}</td>
                <td>${cita.barberoId.nombre}</td>
                <td>
                  <button class="text-blue-500 hover:text-blue-700" onclick="editarCita('${cita._id}')">Editar</button>
                  <button class="text-red-500 hover:text-red-700" onclick="eliminarCita('${cita._id}')">Eliminar</button>
                </td>
              </tr>
            `;
          });

          // Mostrar el modal
          modalMisCitas.classList.remove("hidden");
        } catch (error) {
          console.error(error);
          alert("Error al cargar las citas");
        }
      }

      // Función para editar una cita
      function editarCita(citaId) {
        // Lógica para editar la cita
        alert(`Editar cita con ID: ${citaId}`);
      }

      // Función para eliminar una cita
      async function eliminarCita(citaId) {
        try {
          const response = await fetch(
            `http://localhost:4000/api/citas/${citaId}`,
            {
              method: "DELETE",
            }
          );
          if (!response.ok) {
            throw new Error("Error al eliminar la cita");
          }
          alert("Cita eliminada correctamente");
          cargarCitas(); // Recargar la lista de citas
        } catch (error) {
          console.error(error);
          alert("Error al eliminar la cita");
        }
      }

      // Evento para abrir el modal de citas
      btnMisCitas.addEventListener("click", cargarCitas);

      // Evento para cerrar el modal de citas
      btnCerrarCitas.addEventListener("click", () => {
        modalMisCitas.classList.add("hidden");
      });
    </script>
  </body>
</html>
