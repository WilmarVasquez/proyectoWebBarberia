<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barbería - Inicio</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-black text-[#cd7f09] font-sans">
    <!-- Header -->
    <header
      class="flex justify-between items-center px-8 py-4 border-b border-[#cd7f09]"
    >
      <h1 class="text-lg font-bold">LOS VUITTON</h1>
      <!-- Botón que abre el modal de Login -->
      <button
        id="btnAbrirLogin"
        class="bg-[#cd7f09] text-black font-semibold px-4 py-2 rounded"
      >
        INGRESAR
      </button>
    </header>

    <!-- Contenido principal -->
    <main class="flex flex-col items-center mt-16">
      <h2 class="text-4xl font-bold mb-2">LOS VUITTON</h2>
      <p class="text-xl mb-8">EXPERIENCIA &amp; ELEGANCIA</p>

      <div
        class="w-48 h-48 flex items-center justify-center border-2 border-[#cd7f09] rounded-full mb-16"
      >
        <span class="text-center text-xl font-bold"
          >AGENDA<br />TU<br />CITA</span
        >
      </div>

      <div class="flex justify-center gap-8 mb-16">
        <img
          src="./src/barber-1453064_1920-min.jpg"
          alt="Imagen 1"
          class="w-72 h-48 object-cover"
        />
        <img
          src="./src/cada-cuanto-ir-a-la-barberia-homme-luxury-barbers-01.jpg"
          alt="Imagen 2"
          class="w-72 h-48 object-cover"
        />
        <img
          src="./src/MasterSello20220125T091828151.jpg"
          alt="Imagen 3"
          class="w-72 h-48 object-cover"
        />
      </div>
    </main>

    <!-- Footer -->
    <footer class="text-center mt-8 border-t border-[#cd7f09] pt-4">
      <p>Calle 13 N° 13 - 13, Pereira</p>
      <p>3219882864</p>
      <p>@losvuitton</p>
    </footer>

    <!-- MODAL DE LOGIN (Iniciar Sesión) -->
    <div
      id="modalLogin"
      class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center"
    >
      <div class="bg-white text-black rounded p-6 w-80">
        <h2 class="text-lg font-bold mb-4">Iniciar Sesión</h2>
        <form id="formLogin">
          <div class="mb-4">
            <label class="block mb-1 text-sm font-medium" for="loginCorreo"
              >Correo</label
            >
            <input
              type="email"
              id="loginCorreo"
              class="w-full border border-gray-300 rounded px-2 py-1 focus:outline-none"
              required
            />
          </div>
          <div class="mb-6">
            <label class="block mb-1 text-sm font-medium" for="loginClave"
              >Contraseña</label
            >
            <input
              type="password"
              id="loginClave"
              class="w-full border border-gray-300 rounded px-2 py-1 focus:outline-none"
              required
            />
          </div>
          <div class="flex justify-between items-center">
            <button
              type="button"
              id="btnCancelarLogin"
              class="px-3 py-1 bg-gray-400 text-white rounded"
            >
              Cancelar
            </button>
            <button
              type="button"
              id="btnAbrirRegister"
              class="text-blue-600 underline"
            >
              Registrarse
            </button>
            <button
              type="submit"
              class="px-3 py-1 bg-[#cd7f09] text-black font-semibold rounded"
            >
              Ingresar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL DE REGISTRO (Formulario Nuevo Usuario) -->
    <div
      id="modalRegistro"
      class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center"
    >
      <div class="bg-white text-black rounded p-6 w-80">
        <h2 class="text-lg font-bold mb-4">Registrarse</h2>
        <form id="formRegistro">
          <div class="mb-4">
            <label class="block mb-1 text-sm font-medium" for="nombre"
              >Nombre</label
            >
            <input
              type="text"
              id="nombre"
              class="w-full border border-gray-300 rounded px-2 py-1 focus:outline-none"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block mb-1 text-sm font-medium" for="correo"
              >Correo</label
            >
            <input
              type="email"
              id="correo"
              class="w-full border border-gray-300 rounded px-2 py-1 focus:outline-none"
              required
            />
          </div>
          <div class="mb-4">
            <label class="block mb-1 text-sm font-medium" for="celular"
              >Nro. Celular</label
            >
            <input
              type="tel"
              id="celular"
              class="w-full border border-gray-300 rounded px-2 py-1 focus:outline-none"
              required
            />
          </div>
          <div class="mb-6">
            <label class="block mb-1 text-sm font-medium" for="clave"
              >Contraseña</label
            >
            <input
              type="password"
              id="clave"
              class="w-full border border-gray-300 rounded px-2 py-1 focus:outline-none"
              required
            />
          </div>
          <div class="flex justify-end gap-2">
            <button
              type="button"
              id="btnCancelarRegistro"
              class="px-3 py-1 bg-gray-400 text-white rounded"
            >
              Cancelar
            </button>
            <button
              type="submit"
              class="px-3 py-1 bg-[#cd7f09] text-black font-semibold rounded"
            >
              Registrar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Script principal -->
    <script>
      const btnAbrirLogin = document.getElementById("btnAbrirLogin");
      const modalLogin = document.getElementById("modalLogin");
      const btnCancelarLogin = document.getElementById("btnCancelarLogin");
      const formLogin = document.getElementById("formLogin");
      const btnAbrirRegister = document.getElementById("btnAbrirRegister");

      const modalRegistro = document.getElementById("modalRegistro");
      const btnCancelarRegistro = document.getElementById(
        "btnCancelarRegistro"
      );
      const formRegistro = document.getElementById("formRegistro");

      // Mostrar modal de Login
      btnAbrirLogin.addEventListener("click", () => {
        modalLogin.classList.remove("hidden");
      });

      // Cancelar Login -> Cerrar Modal
      btnCancelarLogin.addEventListener("click", () => {
        modalLogin.classList.add("hidden");
      });

      // Abrir Modal de Registro desde el Modal de Login
      btnAbrirRegister.addEventListener("click", () => {
        modalLogin.classList.add("hidden");
        modalRegistro.classList.remove("hidden");
      });

      // Cancelar Registro -> Cerrar Modal de Registro
      btnCancelarRegistro.addEventListener("click", () => {
        modalRegistro.classList.add("hidden");
      });

      // -- SUBMIT: FORM LOGIN --
      formLogin.addEventListener("submit", async (e) => {
        e.preventDefault();
        const loginCorreo = document.getElementById("loginCorreo").value;
        const loginClave = document.getElementById("loginClave").value;

        try {
          const response = await fetch(
            "http://localhost:4000/api/usuarios/login",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ correo: loginCorreo, clave: loginClave }),
            }
          );

          if (!response.ok) {
            const errorData = await response.json();
            alert("Error al iniciar sesión: " + errorData.message);
            return;
          }

          // Guardar el userId en el localStorage
          const data = await response.json();
          localStorage.setItem("userId", data.usuario._id);

          // Redirigir al dashboard
          window.location.href = "./dashboard.html";
        } catch (error) {
          console.error(error);
          alert("Error al iniciar sesión");
        }
      });

      // -- SUBMIT: FORM REGISTRO --
      formRegistro.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nombre = document.getElementById("nombre").value;
        const correo = document.getElementById("correo").value;
        const celular = document.getElementById("celular").value;
        const clave = document.getElementById("clave").value;

        try {
          const response = await fetch("http://localhost:4000/api/usuarios", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre, correo, celular, clave }),
          });

          if (!response.ok) {
            const errorData = await response.json();
            alert("Error: " + errorData.message);
            return;
          }

          const data = await response.json();
          alert(`Usuario ${data.nombre} registrado con éxito!`);

          // Cerrar modal de Registro y limpiar formulario
          modalRegistro.classList.add("hidden");
          formRegistro.reset();
        } catch (error) {
          console.error(error);
          alert("Error al registrar usuario");
        }
      });
    </script>
  </body>
</html>
